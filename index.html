<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/icon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JXNU" />
  <link rel="alternate" type="application/rss+xml" title="JXNU PUBLISH 全站 RSS" href="/rss.xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="JXNU PUBLISH 汇聚江西师范大学多学院通知，提供结构化浏览、按学院筛选与 RSS 订阅，帮助你更快获取校内动态。" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="9da13b54-da7b-4db9-a91c-59d11ccbb995"></script>
  <title>JXNU Publish</title>
  <!-- Tailwind CSS injected via build process now -->
  <style>
    /* Simple dark mode detection & initial loader to prevent white flash before Tailwind loads */
    body {
      margin: 0;
      background-color: hsl(0 0% 99%);
      color: hsl(0 62% 22%);
    }

    html.dark body {
      background-color: hsl(220 10% 11%);
      color: hsl(0 0% 92%);
    }

    #initial-loader {
      display: flex;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      animation: fadein 0.3s ease-in;
    }

    .loader-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: hsl(0 22% 42%);
      font-family: 'Noto Sans SC', ui-sans-serif, system-ui, sans-serif;
    }

    html.dark .loader-content {
      color: hsl(0 0% 66%);
    }

    .loader-spinner {
      height: 1rem;
      width: 1rem;
      border-radius: 9999px;
      border: 2px solid hsl(0 74% 43%);
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    html.dark .loader-spinner {
      border-color: hsl(0 72% 48%);
      border-top-color: transparent;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadein {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
  <script>
    (function () {
      try {
        var localTheme = localStorage.getItem('theme');
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (localTheme === 'dark' || (!localTheme && sysDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <script>
    (function () {
      var state = window.__JXNU_PWA__ || { deferredPrompt: null, isInstalled: false };
      window.__JXNU_PWA__ = state;

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        state.deferredPrompt = event;
        window.dispatchEvent(new Event('jxnu:pwa-installable'));
      });

      window.addEventListener('appinstalled', function () {
        state.isInstalled = true;
        state.deferredPrompt = null;
        window.dispatchEvent(new Event('jxnu:pwa-installed'));
      });
    })();
  </script>
</head>

<body class="antialiased h-[100dvh] overflow-hidden transition-colors duration-300">
  <div id="root" class="h-full">
    <div id="initial-loader">
      <div class="loader-content">
        <div class="loader-spinner"></div>
        <span>载入中</span>
      </div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>

</html>
