name: Build and Deploy Main

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "worklog/**"
      - "scripts/**"
      - "config/**"
      - "public/**"
      - "src/**"
      - "components/**"
      - "api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.*"
      - "tsconfig*.json"
      - "vercel.json"
      - ".github/workflows/deploy-main.yml"
  workflow_dispatch:

concurrency:
  group: deploy-static-site-main
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      branch: main
    secrets:
      SITE_URL: ${{ secrets.PROD_SITE_URL != '' && secrets.PROD_SITE_URL || secrets.SITE_URL }}
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST != '' && secrets.PROD_DEPLOY_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT != '' && secrets.PROD_DEPLOY_PORT || secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER != '' && secrets.PROD_DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY != '' && secrets.PROD_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
