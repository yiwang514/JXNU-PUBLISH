name: Build and Deploy Main

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "worklog/**"
      - "scripts/**"
      - "config/**"
      - "public/**"
      - "src/**"
      - "components/**"
      - "api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.*"
      - "tsconfig*.json"
      - "vercel.json"
      - ".github/workflows/deploy-main.yml"
  workflow_dispatch:

concurrency:
  group: deploy-static-site-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server (existing)
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      branch: main
    secrets:
      SITE_URL: ${{ secrets.PROD_SITE_URL != '' && secrets.PROD_SITE_URL || secrets.SITE_URL }}
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST != '' && secrets.PROD_DEPLOY_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT != '' && secrets.PROD_DEPLOY_PORT || secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER != '' && secrets.PROD_DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY != '' && secrets.PROD_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      ATTACHMENT_R2_THRESHOLD_MB: ${{ vars.ATTACHMENT_R2_THRESHOLD_MB != '' && vars.ATTACHMENT_R2_THRESHOLD_MB || '20' }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_PROJECT_NAME" || (echo "Missing secret: CLOUDFLARE_PROJECT_NAME" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Restore previous content snapshot from Pages
        run: |
          PAGES_URL="${{ secrets.CLOUDFLARE_PAGES_URL }}"
          if [ -z "$PAGES_URL" ]; then
            PAGES_URL="https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          fi
          mkdir -p public/generated
          curl -fsSL "$PAGES_URL/generated/content-data.json" -o public/generated/content-data.json || echo "::warning::No previous content snapshot found on Cloudflare Pages, building from scratch"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload oversized attachments to R2
        run: pnpm run upload:r2:large-attachments

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build dist
        env:
          ATTACHMENT_R2_THRESHOLD_MB: ${{ env.ATTACHMENT_R2_THRESHOLD_MB }}
          R2_PUBLIC_BASE_URL: ${{ env.R2_PUBLIC_BASE_URL }}
        run: pnpm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -s dist/index.html || (echo "dist/index.html is empty" && exit 1)

      - name: Prepare SPA fallback
        run: |
          cp dist/index.html dist/404.html
          if [ ! -f dist/_redirects ]; then
            echo "/* /index.html 200" > dist/_redirects
          fi

      - name: Deploy dist to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main
